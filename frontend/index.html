<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Negotiation Ledger</title>
<style>
  :root {
    --paper: #f2ede3;
    --paper-line: #d8cfba;
    --ink: #1f2937;
    --ink-soft: #5b6472;
    --buyer: #1d4e6b;
    --supplier: #7a4a1d;
    --pass: #2f6b3a;
    --fail: #a3312a;
    --stamp: #b0812a;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --mono: 'Courier New', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 28px);
    color: var(--ink);
    font-family: var(--serif);
    padding: 48px 24px 96px;
  }

  .sheet {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: 0.3px;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 13px;
  }

  .status {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    border: 1.5px solid var(--stamp);
    color: var(--stamp);
    font-family: var(--mono);
    font-size: 13px;
    transform: rotate(-1.5deg);
  }
  .status.deal { border-color: var(--pass); color: var(--pass); }
  .status.nodeal { border-color: var(--fail); color: var(--fail); }

  .entry {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--paper-line);
  }

  .entry .round {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    padding-top: 4px;
  }

  .entry .who {
    font-weight: bold;
    font-size: 15px;
  }
  .entry.buyer .who { color: var(--buyer); }
  .entry.supplier .who { color: var(--supplier); }

  .entry .msg {
    margin: 4px 0 8px;
    font-style: italic;
    color: var(--ink-soft);
  }

  .terms {
    display: flex;
    gap: 18px;
    font-family: var(--mono);
    font-size: 13px;
    flex-wrap: wrap;
  }

  .terms span b { color: var(--ink); }

  .badge {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .badge.pass { color: var(--pass); border: 1px solid var(--pass); }
  .badge.fail { color: var(--fail); border: 1px solid var(--fail); background: rgba(163,49,42,0.06); }

  .violations {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fail);
  }

  .empty {
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
  }

  .contract {
    margin-top: 40px;
    padding: 24px;
    border: 2px solid var(--stamp);
    background: rgba(176,129,42,0.05);
  }
  .contract h2 {
    font-weight: normal;
    margin-top: 0;
    font-size: 20px;
  }
  .contract .terms { margin-top: 10px; }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <h1>Autonomous B2B Supply Chain Negotiation</h1>
      <p id="meta">loading audit_log.json ...</p>
      <div id="statusBadge"></div>
    </header>

    <div id="log" class="empty">
      Waiting for negotiation data. Run <code>python orchestrator.py</code> in the
      backend/ folder first, then refresh this page.
    </div>

    <div id="contractBox"></div>
  </div>

<script>
async function loadData() {
  const logEl = document.getElementById('log');
  const metaEl = document.getElementById('meta');
  const statusEl = document.getElementById('statusBadge');
  const contractBox = document.getElementById('contractBox');

  try {
    const auditRes = await fetch('../backend/audit_log.json');
    const audit = await auditRes.json();

    metaEl.textContent = `${audit.length} offers exchanged · generated by orchestrator.py`;
    logEl.classList.remove('empty');
    logEl.innerHTML = '';

    audit.forEach(entry => {
      const div = document.createElement('div');
      div.className = `entry ${entry.role}`;
      const o = entry.offer;
      div.innerHTML = `
        <div class="round">R${entry.round}<br>${entry.role.toUpperCase()}</div>
        <div>
          <div class="who">${entry.agent_name}</div>
          <div class="msg">"${entry.message}"</div>
          <div class="terms">
            <span>price <b>$${o.unit_price}</b></span>
            <span>delivery <b>${o.delivery_days}d</b></span>
            <span>SLA penalty <b>${o.sla_penalty_pct}%</b></span>
          </div>
          <div class="badge ${entry.guardrail_passed ? 'pass' : 'fail'}">
            ${entry.guardrail_passed ? 'guardrail: passed' : 'guardrail: rejected'}
          </div>
          ${!entry.guardrail_passed ? `<div class="violations">${entry.guardrail_violations.join('<br>')}</div>` : ''}
        </div>
      `;
      logEl.appendChild(div);
    });

    try {
      const summaryRes = await fetch('../backend/result_summary.json');
      const summary = await summaryRes.json();
      if (summary.deal_reached) {
        statusEl.innerHTML = '<div class="status deal">DEAL REACHED</div>';
      } else {
        statusEl.innerHTML = '<div class="status nodeal">NO DEAL</div>';
      }
    } catch (e) { /* summary not generated yet */ }

    try {
      const contractRes = await fetch('../backend/contract.json');
      const contract = await contractRes.json();
      contractBox.innerHTML = `
        <div class="contract">
          <h2>Executed Contract — ${contract.contract_id}</h2>
          <div>${contract.item}</div>
          <div class="terms">
            <span>price <b>$${contract.terms.unit_price}</b></span>
            <span>delivery <b>${contract.terms.delivery_days}d</b></span>
            <span>SLA penalty <b>${contract.terms.sla_penalty_pct}%</b></span>
          </div>
          <p style="font-family: var(--mono); font-size: 12px; color: var(--ink-soft);">
            Signed ${contract.signed_at} · Status: ${contract.status}
          </p>
        </div>
      `;
    } catch (e) { /* no contract yet, no deal was reached */ }

  } catch (err) {
    metaEl.textContent = 'no data found yet';
  }
}
loadData();
</script>
</body>
</html>
